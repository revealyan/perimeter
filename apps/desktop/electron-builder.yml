# Упаковка приложения (electron-builder): NSIS-установщик + portable-exe для Windows.
# app-supervisor (бандл локального supervisor'а) готовит scripts/prepare-pack.mjs в resources/.
appId: app.perimeter.desktop
productName: Perimeter
copyright: Perimeter

directories:
  output: ../dist-desktop
  buildResources: build

files:
  - main/**
  - preload.mjs
  - dist-renderer/**
  - package.json
  - "!**/*.map"

# нативные модули (node-pty в зависимостях протокола supervisor'а не едет — локальная среда ставит свой;
# ssh2 с нативными ускорителями — optional и без них работает)
asar: true

# бандлы сборки prepare-pack: <resources>/app-supervisor (локальная среда) и <resources>/app-server (VPS)
extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"

win:
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: perimeter-setup-${version}.${ext}

portable:
  artifactName: perimeter-portable-${version}.${ext}

# macOS (владелец 2026-11-26: «у нас нет сборки под мак»): dmg — поставить, zip — для проверки обновлений
# (latest-mac.yml). Apple Developer ID нет — подпись ad-hoc («-»): без неё на Apple Silicon приложение не запустится
# вовсе; первый запуск — «Системные настройки → Конфиденциальность и безопасность → Всё равно открыть» (Sequoia
# убрала обход правым кликом). Squirrel.Mac ставит только
# настоящую подпись — поэтому на маке обновление «Скачать vX» ведёт на страницу релиза (updater.mjs, manual).
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  identity: "-"
  hardenedRuntime: false
  artifactName: perimeter-${version}-mac-${arch}.${ext}

dmg:
  artifactName: perimeter-${version}-${arch}.${ext}

# обновление приложения (electron-updater, main/updater.mjs): с этим провайдером сборка кладёт рядом latest.yml и
# .blockmap (CI прикладывает их к релизу), а в приложение — app-update.yml. Сам builder ничего не публикует
# (EP_PUBLISH=never) — релиз публикует отдельный шаг CI.
publish:
  provider: github
  owner: revealyan
  repo: perimeter
  releaseType: release
