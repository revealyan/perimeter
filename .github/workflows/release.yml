# Релиз: тег v* → тесты → сборки (Windows: установщик + portable; macOS: dmg + zip под arm64 и x64) → GitHub Release.
# Паблик-репо: GITHUB_TOKEN с permissions contents:write хватает для публикации.
# Сборки параллельно, публикация — отдельным шагом из их файлов. Мак упал — Windows-релиз всё равно выходит
# (автообновление установленных версий не должно зависеть от мак-сборки).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Сборка без публикации: electron-builder на теге публикует сам (неявное `onTag`, EP_PUBLISH он не знает) —
      # с `publish: github` в конфиге и токеном в env это давало второй релиз с тем же тегом (v0.2.7, v0.2.8).
      # `--publish never` — в скрипте dist; токена шагу не даём, чтобы и случайно не смог. latest.yml пишется и так.
      - run: npm run dist -w @perimeter/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: win
          if-no-files-found: error
          path: |
            apps/dist-desktop/perimeter-setup-*.exe
            apps/dist-desktop/perimeter-setup-*.exe.blockmap
            apps/dist-desktop/latest.yml
            apps/dist-desktop/perimeter-portable-*.exe

  mac:
    # macos-latest — Apple Silicon; x64 собирается там же (electron-builder умеет обе архитектуры на маке)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dist:mac -w @perimeter/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          if-no-files-found: error
          path: |
            apps/dist-desktop/perimeter-*.dmg
            apps/dist-desktop/perimeter-*-mac-*.zip
            apps/dist-desktop/*.blockmap
            apps/dist-desktop/latest-mac.yml

  # Публикация — один шаг gh: с файлами сам делает черновик → заливает → публикует; повторный прогон того же тега
  # дозаливает файлы (--clobber), а не плодит релизы.
  release:
    needs: [windows, mac]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: релиз
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          MAC_RESULT: ${{ needs.mac.result }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          v="$(node -p "require('./apps/desktop/package.json').version")"
          [ "$tag" = "v$v" ] || { echo "тег $tag не совпадает с версией package.json ($v)"; exit 1; }
          cd dist
          # Windows — обязательно (latest.yml и .blockmap — для автообновления установленной версии)
          win=("perimeter-setup-$v.exe" "perimeter-setup-$v.exe.blockmap" latest.yml "perimeter-portable-$v.exe")
          for f in "${win[@]}"; do [ -f "$f" ] || { echo "нет файла $f"; ls; exit 1; }; done
          # macOS — если собралась (dmg — поставить; zip + latest-mac.yml — проверка обновлений)
          mac=()
          if [ "$MAC_RESULT" = "success" ]; then
            for a in arm64 x64; do
              for f in "perimeter-$v-$a.dmg" "perimeter-$v-mac-$a.zip"; do [ -f "$f" ] && mac+=("$f"); done
            done
            [ -f latest-mac.yml ] && mac+=(latest-mac.yml)
          else
            echo "::warning::мак-сборка не удалась ($MAC_RESULT) — релиз только для Windows"
          fi
          sha256sum "perimeter-setup-$v.exe" "perimeter-portable-$v.exe" ${mac[@]+"${mac[@]}"} > SHA256SUMS.txt
          files=("${win[@]}" ${mac[@]+"${mac[@]}"} SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$tag" --generate-notes --latest --verify-tag
          fi

  # Канал npm (`npx @revealyan/perimeter`; владелец 2026-11-26: «делаем, пока нет подписки для аппстора»): лаунчер +
  # приложение, Electron — зависимостью (npm не ставит пометок «скачано из интернета» — ни SmartScreen, ни Gatekeeper).
  # Без секрета NPM_TOKEN — пропускается с предупреждением. --provenance: npm показывает, из какого коммита и CI собрано.
  npm:
    needs: [windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build -w @perimeter/desktop && npm run prepare-pack -w @perimeter/desktop
      - run: node apps/desktop/scripts/pack-npm.mjs
      - name: публикация в npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::warning::нет секрета NPM_TOKEN — в npm не опубликовано (docs/distribution.md)"; exit 0; fi
          cd apps/dist-npm && npm publish --access public --provenance

  # winget (`winget install revealyan.Perimeter`): пулл-реквест в microsoft/winget-pkgs с новой версией установщика.
  # Действие обновляет уже заведённый пакет — первую версию подаёт владелец (docs/distribution.md). Без WINGET_TOKEN — пропуск.
  winget:
    needs: [release]
    runs-on: ubuntu-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: без токена — пропуск
        if: env.WINGET_TOKEN == ''
        run: echo "::warning::нет секрета WINGET_TOKEN — winget не обновлён (docs/distribution.md)"
      - uses: vedantmgoyal9/winget-releaser@v2
        if: env.WINGET_TOKEN != ''
        with:
          identifier: revealyan.Perimeter
          installers-regex: 'perimeter-setup-[0-9.]+\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
