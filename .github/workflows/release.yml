# Релиз: тег v* → тесты → сборка → установщик и portable в GitHub Release.
# Паблик-репо: GITHUB_TOKEN с permissions contents:write хватает для публикации.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # Сборка без публикации: electron-builder на теге публикует сам (неявное `onTag`, EP_PUBLISH он не знает) —
      # с `publish: github` в конфиге и токеном в env это давало второй релиз с тем же тегом (v0.2.7, v0.2.8).
      # `--publish never` — в скрипте dist; токена шагу не даём, чтобы и случайно не смог. latest.yml пишется и так.
      - run: npm run dist -w @perimeter/desktop
      - name: контрольные суммы
        shell: bash
        run: |
          cd apps/dist-desktop
          sha256sum perimeter-setup-*.exe perimeter-portable-*.exe > SHA256SUMS.txt
      # Публикация — один шаг gh: с файлами сам делает черновик → заливает → публикует; повторный прогон того же тега
      # дозаливает файлы (--clobber), а не плодит релизы.
      - name: релиз
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          v="$(node -p "require('./apps/desktop/package.json').version")"
          [ "$tag" = "v$v" ] || { echo "тег $tag не совпадает с версией package.json ($v)"; exit 1; }
          cd apps/dist-desktop
          # latest.yml и .blockmap — для автообновления установленной версии (electron-updater); публикуем сразу
          # (владелец 2026-11-25: «сам паблишь»), заметки — из коммитов
          files=("perimeter-setup-$v.exe" "perimeter-setup-$v.exe.blockmap" latest.yml "perimeter-portable-$v.exe" SHA256SUMS.txt)
          for f in "${files[@]}"; do [ -f "$f" ] || { echo "нет файла $f"; ls; exit 1; }; done
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "$tag" --generate-notes --latest --verify-tag
          fi
