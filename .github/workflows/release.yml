# Релиз: тег v* → тесты → сборка → установщик и portable в GitHub Release.
# Паблик-репо: GITHUB_TOKEN с permissions contents:write хватает для публикации.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist -w @perimeter/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # публикацию делает отдельный шаг (softprops) — сам electron-builder на теге лезет публиковать сам и падает
          EP_PUBLISH: never
      - name: контрольные суммы
        shell: bash
        run: |
          cd apps/dist-desktop
          sha256sum perimeter-setup-*.exe perimeter-portable-*.exe > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          # публикуем сразу (владелец 2026-11-25: «сам паблишь» — черновики жать руками надоело); заметки — из коммитов
          draft: false
          make_latest: true
          generate_release_notes: true
          # latest.yml и .blockmap — для автообновления установленной версии (electron-updater)
          files: |
            apps/dist-desktop/perimeter-setup-*.exe
            apps/dist-desktop/perimeter-setup-*.exe.blockmap
            apps/dist-desktop/latest.yml
            apps/dist-desktop/perimeter-portable-*.exe
            apps/dist-desktop/SHA256SUMS.txt
